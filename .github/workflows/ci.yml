name: Build and Deploy
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:


permissions:
  contents: write

jobs:

  build-homepage:
    name: Build Homepage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'zjusct-home/pnpm-lock.yaml'

      - name: Install dependencies
        run: cd zjusct-home && pnpm install

      - name: Build project
        run: cd zjusct-home && pnpm build

      - name: Package artifact
        run: cd zjusct-home/dist && tar -czvf home-assets.tar.gz -C assets .

      - name: Upload Homepage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: home-assets.tar.gz
          path: zjusct-home/dist/home-assets.tar.gz

  deploy:
    name: Build Zensical Site and Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-homepage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Download Homepage Artifact
        uses: actions/download-artifact@v4
        with:
          name: home-assets.tar.gz

      - name: Extract Homepage Assets
        run: tar -xzvf home-assets.tar.gz -C docs/assets

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Build docs
        run: uv run zensical build

      - name: Deploy site
        run: uv run ghp-import -n -p -f site
