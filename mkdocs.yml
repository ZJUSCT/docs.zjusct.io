site_name: ZJUSCT
site_url: https://www.zjusct.io/
repo_name: www.zjusct.io
repo_url: https://github.com/ZJUSCT/www.zjusct.io
edit_uri: blob/main/docs/
site_description: ZJUSCT
site_author: ZJUSCT
copyright: ZJUSCT

nav:
  # 已启用 include_dir_to_nav 插件，可使用目录名添加该目录下所有文件
  # 文件按字母序排列，如果同级有其他文件，就需要专门把 index.md 放在最前面
  - 首页: index.md
  - 文档指引:
    - guideline/index.md
    - guideline
  - 🏆 竞赛: competition
  - 🦅 Falcon:
    - falcon/index.md
    - falcon
  - 🔧 优化:
    - optimization/index.md
    - 并行编程: optimization/parallel
    - 高性能网络: optimization/HPN
  - ⚙️ 运维:
    - operation/index.md
    - 🐧 系统软件: operation/system
    - 💾 存储: operation/storage
    - ⚓ K8S:
      - 管理篇: operation/k8s/mgmt
      - 服务篇: operation/k8s/svc
  - ✍️ 博客: blog


theme:
  name: material
  custom_dir: overrides
  logo: assets/zjusct.svg
  favicon: assets/zjusct.png
  palette:
    - media: "(prefers-color-scheme)"
      primary: black
      toggle:
        icon: material/brightness-auto
        name: 切换至浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: zjusct
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 根据系统模式切换主题
  features:
    # 代码块操作
    - content.code.copy
    - content.code.select
    - content.code.annotate
    # 底部导航
    - navigation.footer
    # 顶部导航
    - navigation.tabs
    # 侧边栏按 section 展开
    - navigation.sections
    - navigation.expand
    # 章节首页 index.md
    - navigation.indexes
    # 锚点
    - navigation.tracking
    # 路径
    - navigation.path
    # 回到顶部
    - navigation.top
    - toc.follow
    # 页面编辑
    - content.action.edit
    # 搜索
    - search.suggest
    - search.highlight
    - search.share

markdown_extensions:
  # Admonition
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      # Mermaid
      custom_fences:
        - name: mermaid
          class: mermaid
          format:
            !!python/name:pymdownx.superfences.fence_code_format # Code Block
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Tab Card
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # Grid, Image
  - attr_list
  - md_in_html
  # Icon
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg # List
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  # TOC
  - toc:
      permalink: true
      # 中文锚点
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  # MathJax
  - pymdownx.arithmatex:
      generic: true
  # Keys
  - pymdownx.keys
  # Highlight
  - pymdownx.critic
  # 时间轴、甘特图
  - neoteroi.timeline
  - neoteroi.projects

extra_javascript:
  # MathJax
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/polyfill/index.min.js
  - https://cdn.jsdelivr.net/npm/mathjax/es5/tex-mml-chtml.js
  # Table Sort
  - https://cdn.jsdelivr.net/npm/tablesort/dist/tablesort.min.js
  - javascripts/tablesort.js
  # mermaid
  - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js

extra_css:
  - stylesheets/fonts.css
  - stylesheets/counter.css
  - stylesheets/theme.css
  # neoteroi
  - stylesheets/neoteroi-v1.1.2.css

plugins:
  - blog
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
  # 该插件本地编辑时关闭，CI 时自动开启
  - git-committers:
      enabled: false
      repository: zjusct/www.zjusct.io
      branch: main
  - glightbox
  - drawio
  - tags
  - search
  - include_dir_to_nav:
      recurse: false
